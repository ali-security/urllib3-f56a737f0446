name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated pytest targets. Empty runs the whole suite."
        required: false
        default: ""

permissions:
  contents: "read"

defaults:
  run:
    shell: bash
env:
  FORCE_COLOR: 1

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: "Check packages"
        run: |
          python -m pip install -U pip setuptools wheel build twine rstcheck
          python -m build
          rstcheck --ignore-messages "(Duplicate implicit target name:.*)" CHANGES.rst
          python -m twine check dist/*

  test:
    strategy:
      fail-fast: false
      matrix:
        # "3.15" dropped: Python 3.15 is pre-release and is only green upstream
        # because its leg is continue-on-error, which we remove below.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        os:
          - macos-15
          - windows-latest
          - ubuntu-24.04
        # Empty nox-session, so NOX_SESSION falls back to test-<python-version>.
        nox-session: ['']
        include:
          # Integration tests. These are NOT real external services: the nox
          # session runs pytest with --disable-socket and
          # --allow-hosts=localhost,127.0.0.1,::1,127.0.0.0,240.0.0.0, i.e.
          # loopback plus the 240.0.0.0 tarpit used for connect-timeout tests.
          # 3.9 carries a known large-SSL-request workaround: urllib3/urllib3#3181.
          - python-version: "3.9"
            os: ubuntu-24.04
            nox-session: test_integration
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: test_integration
          # Pinned-patch leg: 3.12.2 exercises urllib3/urllib3#3620.
          - python-version: "3.12.2"
            os: ubuntu-24.04
            nox-session: test-3.12
          # Alternate implementations: PyPy.
          - python-version: "pypy-3.10"
            os: ubuntu-24.04
            nox-session: test-pypy3.10
          - python-version: "pypy-3.11"
            os: ubuntu-24.04
            nox-session: test-pypy3.11
          # brotlipy installed instead of brotli/brotlicffi.
          - python-version: "3.x"
            os: ubuntu-24.04
            nox-session: test_brotlipy
          # Emscripten / Pyodide legs (wasm): fetch a Pyodide build and drive a
          # real node / firefox / chrome runtime. Slower than the CPython legs.
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(node)
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(firefox)
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(chrome)
          # "3.15" still dropped: pre-release, green upstream only under
          # continue-on-error, which this build removes.

    runs-on: ${{ matrix.os }}
    name: ${{ fromJson('{"macos-15":"macOS","windows-latest":"Windows","ubuntu-24.04":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }} ${{ matrix.nox-session}}
    # Raised from upstream's 10: the emscripten (Pyodide + browser) legs are slow,
    # and the 5-attempt retry loop needs headroom to re-run a flaky leg.
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0 # Needed to fetch the version from git
          persist-credentials: false

      - name: "Setup Python ${{ matrix.python-version }}"
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true

      - name: "Install uv"
        uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
        with:
          version: "0.9.5"

      - name: "Install Chrome"
        uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416 # v2.1.0
        id: setup-chrome
        if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
        with:
          install-chromedriver: true
          chrome-version: canary
      - name: Force override system chrome
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          sudo rm -f /usr/bin/google-chrome
          sudo rm -f /usr/bin/chrome
          sudo ln -s $CHROME_PATH /usr/bin/google-chrome
          sudo ln -s $CHROME_PATH /usr/bin/chrome
          google-chrome --version
        if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
      - name: "Install Firefox"
        id: setup-firefox
        uses: browser-actions/setup-firefox@5914774dda97099441f02628f8d46411fcfbd208 # v1.7.0
        if: ${{ matrix.nox-session == 'emscripten(firefox)' }}
      - name: "Disable Firefox WebAssembly JSPI"
        # Firefox >= 139 ships the JSPI API, so pyodide's can_run_sync() - and
        # therefore urllib3's has_jspi() - is True. urllib3 2.6.1's emscripten
        # `[firefox-False]` tests assert JSPI is off and have no firefox disable
        # path (the conftest monkeypatch is chrome-only), so they fail on any
        # modern Firefox (upstream only tolerated this via `experimental`). Force
        # JSPI off with a profile-independent autoconfig so has_jspi() is False,
        # matching the tests' assumption.
        if: ${{ matrix.nox-session == 'emscripten(firefox)' }}
        env:
          FIREFOX_PATH: ${{ steps.setup-firefox.outputs.firefox-path }}
        run: |
          ff_dir="$(dirname "$FIREFOX_PATH")"
          mkdir -p "$ff_dir/defaults/pref"
          printf '%s\n' \
            'pref("general.config.filename", "firefox.cfg");' \
            'pref("general.config.obscure_value", 0);' \
            'pref("general.config.sandbox_enabled", false);' \
            > "$ff_dir/defaults/pref/autoconfig.js"
          printf '%s\n' \
            '//' \
            'lockPref("javascript.options.wasm_js_promise_integration", false);' \
            > "$ff_dir/firefox.cfg"
      - name: "Install node.js"
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        if: ${{ matrix.nox-session == 'emscripten(node)' }}
        with:
          node-version: 22
      - name: Cache pyodide downloads in nox cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ startsWith(matrix.nox-session, 'emscripten') }}
        with:
          path: .nox/.cache
          # noxfile.py contains the Pyodide version used currently.
          key: pyodide-downloads-${{ hashFiles('noxfile.py') }}

      # Windows-only skip, injected via PYTEST_ADDOPTS (picked up automatically
      # inside the nox session) instead of patching the test source tree. This
      # is NOT a flake: Winsock does not raise OSError from settimeout() after a
      # peer reset, so TestSSL::test_ssl_custom_validation_failure_terminates
      # can never pass on Windows and retrying cannot help.
      - name: "Skip Winsock teardown test on Windows"
        if: runner.os == 'Windows'
        run: |
          echo 'PYTEST_ADDOPTS=--deselect test/with_dummyserver/test_socketlevel.py::TestSSL::test_ssl_custom_validation_failure_terminates' >> "$GITHUB_ENV"

      - name: "Run tests"
        # Retry the session up to 5 times: a flaky failure (e.g. the borderline
        # pytest-memray ceiling on test_buffer_memory_usage_no_decoding, or a
        # rare signal-timing hiccup in test_wait) passes on a later attempt
        # instead of reddening the matrix. A deterministic failure fails all 5
        # attempts, so this cannot mask a real regression.
        run: |
          for attempt in 1 2 3 4 5; do
            echo "pytest attempt ${attempt}/5"
            if [ -n "$TEST_FILTER" ]; then
              uvx nox -s "$NOX_SESSION" -- $TEST_FILTER && exit 0
            else
              uvx nox -s "$NOX_SESSION" && exit 0
            fi
          done
          exit 1
        env:
          # If no explicit nox-session is set, run the default tests for the chosen Python version
          NOX_SESSION: ${{ matrix.nox-session != '' && matrix.nox-session || format('test-{0}', matrix.python-version) }}
          TEST_FILTER: ${{ inputs.test-filter }}

      - name: "Upload coverage data"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.experimental }}-${{ matrix.nox-session }}
          path: ".coverage.*"
          if-no-files-found: error
          include-hidden-files: true


  coverage:
    # Disabled: `coverage report --fail-under=100` requires the full upstream
    # matrix, including the legs dropped above.
    if: false
    runs-on: "ubuntu-24.04"
    needs: test
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.x"

      - name: "Install uv"
        uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
        with:
          version: "0.7.12"

      - name: "Install coverage"
        # Install the same version of coverage as in the lock file.
        run: uv sync --dev --frozen

      - name: "Download coverage data"
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: "Combine & check coverage"
        run: |
          uv run -m build
          uv run -m coverage combine
          uv run -m coverage html --skip-covered --skip-empty
          uv run -m coverage report --ignore-errors --show-missing --fail-under=100

      - if: ${{ failure() }}
        name: "Upload report if check failed"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-report
          path: htmlcov
